<!DOCTYPE html>
<html lang="fr-BE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tests — Budget</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; background: #0f1115; color: #eef0f4; padding: 1rem; }
    h1 { font-size: 1.3rem; }
    li { margin: .35rem 0; line-height: 1.35; }
    .ok { color: #3ecf8e; } .ko { color: #f25f5c; font-weight: 700; }
    small { color: #9aa1ad; display: block; }
    #bilan { font-size: 1.15rem; font-weight: 700; margin: 1rem 0; }
  </style>
</head>
<body>
  <h1>Tests automatiques du moteur</h1>
  <p>Cette page vérifie les règles de calcul sans toucher à tes données.</p>
  <div id="bilan">…</div>
  <ul id="liste"></ul>

  <script type="module">
    import { echeances } from './js/recurrents.js';
    import { periodeContenant, libellePeriode } from './js/dates.js';
    import { euros, versCentimes } from './js/format.js';
    import { lireSauvegarde, ecartJours, nomFichier, FORMAT, VERSION_FORMAT } from './js/sauvegarde.js';
    import {
      totauxPeriode, aVenir, resteADepenser, depensesParCategorie, statutBudget,
      franchissement, prochainesEcheances, soldeAttendu,
      coupurePrecedente, comparerCategories, sommeDepenses, joursSansSaisie,
    } from './js/calculs.js';
    import { libelleDates } from './js/dates.js';
    import { eurosArrondis, versCentimesSigne } from './js/format.js';

    const tests = [];
    const t = (nom, obtenu, attendu) => tests.push({ nom, obtenu: JSON.stringify(obtenu), attendu: JSON.stringify(attendu) });
    const rec = (o) => ({ montant_centimes: 1000, frequence: 'mensuelle', date_fin: null, ...o });

    // --- Récurrents ---
    t('Mensuel le 5, d\'octobre à décembre',
      echeances(rec({ date_debut: '2026-10-05' }), null, '2026-12-31'),
      ['2026-10-05', '2026-11-05', '2026-12-05']);

    t('Jour 31 → dernier jour des mois courts (févr. 28, avr. 30)',
      echeances(rec({ date_debut: '2026-01-31' }), null, '2026-04-30'),
      ['2026-01-31', '2026-02-28', '2026-03-31', '2026-04-30']);

    t('Jour 31 en année bissextile (févr. 2028 = 29)',
      echeances(rec({ date_debut: '2028-01-31' }), null, '2028-02-29'),
      ['2028-01-31', '2028-02-29']);

    t('Trimestriel ancré sur le 15/03 → 15/06, 15/09, 15/12',
      echeances(rec({ frequence: 'trimestrielle', date_debut: '2026-03-15' }), null, '2026-12-31'),
      ['2026-03-15', '2026-06-15', '2026-09-15', '2026-12-15']);

    t('Annuel le 10/07, passe l\'année',
      echeances(rec({ frequence: 'annuelle', date_debut: '2026-07-10' }), null, '2028-12-31'),
      ['2026-07-10', '2027-07-10', '2028-07-10']);

    t('Rattrapage : appli pas ouverte depuis 3 mois',
      echeances(rec({ date_debut: '2026-01-05' }), '2026-02-05', '2026-05-20'),
      ['2026-03-05', '2026-04-05', '2026-05-05']);

    t('Pas de doublon : déjà généré jusqu\'au 05/05',
      echeances(rec({ date_debut: '2026-01-05' }), '2026-05-05', '2026-05-31'),
      []);

    t('Échéance du jour même incluse',
      echeances(rec({ date_debut: '2026-10-31' }), null, '2026-10-31'),
      ['2026-10-31']);

    t('Échéance future non générée',
      echeances(rec({ date_debut: '2026-11-05' }), null, '2026-10-31'),
      []);

    t('Date de fin dépassée → plus rien après',
      echeances(rec({ date_debut: '2026-01-10', date_fin: '2026-03-15' }), null, '2026-12-31'),
      ['2026-01-10', '2026-02-10', '2026-03-10']);

    t('Montant à 0 → ignoré',
      echeances(rec({ date_debut: '2026-01-10', montant_centimes: 0 }), null, '2026-12-31'),
      []);

    t('Sans date de première échéance → ignoré',
      echeances(rec({ date_debut: null }), null, '2026-12-31'),
      []);

    // --- Périodes ---
    t('Période du mois (début le 1er)', periodeContenant('2026-10-31', 1), { annee: 2026, mois: 10, debut: '2026-10-01', fin: '2026-10-31' });
    t('Période début le 25 (date le 10/11)', periodeContenant('2026-11-10', 25), { annee: 2026, mois: 10, debut: '2026-10-25', fin: '2026-11-24' });
    t('Libellé période début le 25', libellePeriode(periodeContenant('2026-11-10', 25), 25), 'Période du 25/10 au 24/11');

    // --- Formats ---
    t('Format 1 234,56 €', euros(123456), '1 234,56 €');
    t('Saisie « 12,5 » → 1250 centimes', versCentimes('12,5'), 1250);
    t('Saisie invalide « 12,345 » → refusée', versCentimes('12,345'), null);

    // --- Sauvegarde ---
    const bonne = () => ({
      format: FORMAT, version: VERSION_FORMAT, exporte_le: '2026-10-31T20:00:00.000Z',
      donnees: {
        operations: [{ id: 1, type: 'sortie', montant_centimes: 1250, date: '2026-10-31', categorie_id: 1 }],
        categories: [{ id: 1, nom: 'Courses' }], recurrents: [{ id: 1, libelle: 'Loyer' }], budgets: [],
      },
      parametres: { theme: 'sombre' },
    });
    const lire = o => lireSauvegarde(JSON.stringify(o));
    t('Sauvegarde valide acceptée', lire(bonne()).ok, true);
    t('Résumé : 1 opération, 1 récurrent', (({ operations, recurrents }) => [operations, recurrents])(lire(bonne()).resume), [1, 1]);
    t('Fichier illisible refusé', lireSauvegarde('pas du json').ok, false);
    t('Autre type de fichier refusé', lire({ foo: 1 }).ok, false);
    t('Version plus récente refusée', lire({ ...bonne(), version: 99 }).ok, false);
    t('Table manquante refusée', lire({ ...bonne(), donnees: { operations: [] } }).ok, false);
    t('Opération avec montant à virgule refusée',
      lire({ ...bonne(), donnees: { ...bonne().donnees, operations: [{ id: 1, type: 'sortie', montant_centimes: 12.5, date: '2026-10-31' }] } }).ok, false);
    t('Opération avec mauvaise date refusée',
      lire({ ...bonne(), donnees: { ...bonne().donnees, operations: [{ id: 1, type: 'sortie', montant_centimes: 100, date: '31/10/2026' }] } }).ok, false);
    t('Ligne sans identifiant refusée',
      lire({ ...bonne(), donnees: { ...bonne().donnees, categories: [{ nom: 'X' }] } }).ok, false);
    t('Sans paramètres : accepté, paramètres vides', lire({ ...bonne(), parametres: undefined }).sauvegarde.parametres, {});
    t('Écart de jours sur un changement de mois', ecartJours('2026-10-25', '2026-11-04'), 10);
    t('Écart de jours à travers le changement d\'heure', ecartJours('2026-10-20', '2026-10-31'), 11);
    t('Nom du fichier', nomFichier('2026-10-31'), 'budget-sauvegarde-2026-10-31.json');

    // --- Reste à dépenser : « mois test » vérifié à la main ---
    // Octobre 2026, on est le 15. Revenus 2 500 ; 5 charges fixes déjà payées (750+120+45+30+60 = 1 005) ;
    // 30 dépenses de 10 € (300) ; virement vers épargne 100 ; virement depuis épargne 40.
    // À venir : Spotify 10 (le 20), Eau trimestrielle 90 (le 18), Taxe auto annuelle 150 (le 25),
    // virement mensuel vers épargne 100 (le 28). Ignorés : assurance trimestrielle (prochaine en novembre),
    // rémunération variable à venir (revenu non reçu).
    const oct = { annee: 2026, mois: 10, debut: '2026-10-01', fin: '2026-10-31' };
    const op = (type, montant, date, extra = {}) => ({ id: Math.random(), type, montant_centimes: montant, date, categorie_id: 1, ...extra });
    const ops = [
      op('entree', 250000, '2026-10-01'),
      ...[[75000, '05'], [12000, '06'], [4500, '07'], [3000, '08'], [6000, '10']].map(([m, j]) => op('sortie', m, `2026-10-${j}`, { categorie_id: 9 })),
      ...Array.from({ length: 30 }, (_, i) => op('sortie', 1000, `2026-10-${String(1 + (i % 14)).padStart(2, '0')}`, { categorie_id: 2 })),
      op('virement', 10000, '2026-10-03', { sens_virement: 'vers_epargne', categorie_id: null }),
      op('virement', 4000, '2026-10-12', { sens_virement: 'depuis_epargne', categorie_id: null }),
      op('sortie', 99900, '2026-09-30', { categorie_id: 2 }),   // hors période : ignorée
      op('sortie', 99900, '2026-11-01', { categorie_id: 2 }),   // hors période : ignorée
    ];
    const recs = [
      { type: 'sortie', frequence: 'mensuelle', montant_centimes: 1000, date_debut: '2026-01-20', libelle: 'Spotify' },
      { type: 'sortie', frequence: 'trimestrielle', montant_centimes: 9000, date_debut: '2026-01-18', libelle: 'Eau' },
      { type: 'sortie', frequence: 'annuelle', montant_centimes: 15000, date_debut: '2025-10-25', libelle: 'Taxe auto' },
      { type: 'sortie', frequence: 'trimestrielle', montant_centimes: 30000, date_debut: '2026-02-10', libelle: 'Assurance hospitalisation' },
      { type: 'entree', frequence: 'mensuelle', montant_centimes: 40000, date_debut: '2026-01-25', libelle: 'Rémunération variable' },
      { type: 'virement', sens_virement: 'vers_epargne', frequence: 'mensuelle', montant_centimes: 10000, date_debut: '2026-01-28', libelle: 'Poire pour la soif' },
      { type: 'sortie', frequence: 'mensuelle', montant_centimes: 0, date_debut: '2026-01-22', libelle: 'Sans montant' },
    ];
    const mt = resteADepenser(ops, recs, '2026-10-15', oct);
    t('Mois test : revenus reçus', mt.entrees, 250000);
    t('Mois test : dépenses et charges déjà payées (1 005 + 300)', mt.sorties, 130500);
    t('Mois test : virements vers / depuis épargne saisis', [mt.vers, mt.depuis], [10000, 4000]);
    t('Mois test : charges à venir (Spotify 10 + Eau 90 + Taxe 150)', mt.aVenir.charges, 25000);
    t('Mois test : virement à venir', mt.aVenir.vers, 10000);
    t('Mois test : RESTE À DÉPENSER = 785,00 €', mt.reste, 78500);
    t('Mois test : 17 jours restants (du 15 au 31)', mt.joursRestants, 17);
    t('Mois test : 46,17 € par jour (arrondi vers le bas)', mt.parJour, 4617);

    t('Trimestrielle : comptée le mois où elle tombe, pas les autres',
      [aVenir(recs, '2026-10-15', oct).charges, aVenir(recs, '2026-11-01', { annee: 2026, mois: 11, debut: '2026-11-01', fin: '2026-11-30' }).charges],
      [25000, 1000 + 30000]);
    t('Une échéance du jour même (déjà générée) n\'est plus « à venir »', aVenir(recs, '2026-10-20', oct).charges, 15000);
    t('Fin de période : plus rien à venir', resteADepenser([], [], '2026-10-31', oct).joursRestants, 1);
    t('Reste négatif : 0 € par jour', resteADepenser([op('sortie', 5000, '2026-10-02')], [], '2026-10-15', oct).parJour, 0);
    t('Virement depuis épargne remonte le reste',
      resteADepenser([op('virement', 5000, '2026-10-02', { sens_virement: 'depuis_epargne' })], [], '2026-10-15', oct).reste, 5000);
    t('Virement vers épargne baisse le reste',
      resteADepenser([op('virement', 5000, '2026-10-02', { sens_virement: 'vers_epargne' })], [], '2026-10-15', oct).reste, -5000);
    t('Période commençant le 25 : opérations du 24/10 exclues, du 25/10 incluses',
      totauxPeriode([op('sortie', 100, '2026-10-24'), op('sortie', 200, '2026-10-25')], { debut: '2026-10-25', fin: '2026-11-24' }).sorties, 200);
    t('Période pas encore commencée : à venir compté depuis son début',
      aVenir(recs, '2026-10-20', { annee: 2026, mois: 11, debut: '2026-11-01', fin: '2026-11-30' }).charges, 31000);

    // --- Budgets ---
    t('Dépenses par catégorie (hors période ignorées)', depensesParCategorie(ops, oct), { 9: 100500, 2: 30000 });
    t('Budget : 79 % vert', statutBudget(7900, 10000).couleur, 'vert');
    t('Budget : 80 % orange', statutBudget(8000, 10000).couleur, 'orange');
    t('Budget : 100 % orange', statutBudget(10000, 10000).couleur, 'orange');
    t('Budget : 100,01 % rouge', statutBudget(10001, 10000).couleur, 'rouge');
    t('Alerte : passage de 70 % à 85 % → 80', franchissement(7000, 8500, 10000), 80);
    t('Alerte : passage de 85 % à 95 % → rien', franchissement(8500, 9500, 10000), null);
    t('Alerte : passage de 95 % à 105 % → 100', franchissement(9500, 10500, 10000), 100);
    t('Alerte : de 50 % à 120 % → 100 (le plus grave)', franchissement(5000, 12000, 10000), 100);
    t('Alerte : pile 80 % déclenche', franchissement(7900, 8000, 10000), 80);
    t('Alerte : déjà dépassé → rien', franchissement(11000, 12000, 10000), null);
    t('Alerte : sans budget → rien', franchissement(0, 5000, 0), null);

    // --- Prochaines échéances ---
    t('Prochaines échéances à 15 jours (triées, max 3)',
      prochainesEcheances(recs, '2026-10-15', 15, 3).map(e => `${e.date} ${e.libelle}`),
      ['2026-10-18 Eau', '2026-10-20 Spotify', '2026-10-25 Rémunération variable']);

    // --- Recalage ---
    const ref = { solde_centimes: 100000, date: '2026-10-10' };
    const flux = [
      op('sortie', 2000, '2026-10-10'),                                   // même jour que le recalage : exclue
      op('sortie', 3000, '2026-10-11'),
      op('entree', 50000, '2026-10-12'),
      op('virement', 10000, '2026-10-13', { sens_virement: 'vers_epargne' }),
      op('virement', 4000, '2026-10-14', { sens_virement: 'depuis_epargne' }),
      op('sortie', 7000, '2026-10-14', { compte: 'Espèces' }),            // autre compte : exclue
      op('sortie', 1000, '2026-10-15', { compte: 'Courant' }),
      op('sortie', 9000, '2026-10-20'),                                   // dans le futur : exclue
    ];
    t('Solde attendu : 1 000 − 30 + 500 − 100 + 40 − 10 = 1 400,00 €', soldeAttendu(ref, flux, '2026-10-15', 'Courant'), 140000);

    // --- Répartition par catégorie ---
    const sept = { annee: 2026, mois: 9, debut: '2026-09-01', fin: '2026-09-30' };
    t('Comparaison « à la même date » : le 15/10 → jusqu\'au 15/09', coupurePrecedente(oct, sept, '2026-10-15'), '2026-09-15');
    t('Comparaison : dernier jour d\'octobre → septembre entier (30 jours)', coupurePrecedente(oct, sept, '2026-10-31'), '2026-09-30');
    t('Comparaison : période terminée → période précédente entière', coupurePrecedente(sept, { debut: '2026-08-01', fin: '2026-08-31' }, '2026-10-15'), '2026-08-31');
    t('Comparaison avec période décalée (25) : 12e jour (05/11) → 12e jour de la précédente (06/10)',
      coupurePrecedente({ debut: '2026-10-25', fin: '2026-11-24' }, { debut: '2026-09-25', fin: '2026-10-24' }, '2026-11-05'), '2026-10-06');
    const cmp = comparerCategories({ 1: 35000, 2: 8000, 3: 6000 }, { 1: 40000, 3: 10000, 4: 2000 });
    t('Catégories fusionnées, plus grosse dépense d\'abord', cmp.map(x => x.id), ['1', '2', '3', '4']);
    t('Écarts par catégorie', cmp.map(x => x.ecart), [-5000, 8000, -4000, -2000]);
    t('Somme des dépenses', sommeDepenses({ 1: 35000, 2: 8000, 3: 6000 }), 49000);

    // --- Rappel de saisie ---
    const saisie = (jour, extra = {}) => ({ id: Math.random(), type: 'sortie', montant_centimes: 100, date: jour, cree_le: `${jour}T12:00:00.000Z`, recurrent_id: null, ...extra });
    t('Rappel : rien depuis le premier jour (4 jours)', joursSansSaisie([], '2026-10-31', '2026-10-27', null), 4);
    t('Rappel : une saisie il y a 2 jours', joursSansSaisie([saisie('2026-10-29')], '2026-10-31', '2026-10-01', null), 2);
    t('Rappel : une saisie aujourd\'hui', joursSansSaisie([saisie('2026-10-31')], '2026-10-31', '2026-10-01', null), 0);
    t('Rappel : les opérations générées ne comptent pas', joursSansSaisie([saisie('2026-10-30', { recurrent_id: 3 })], '2026-10-31', '2026-10-27', null), 4);
    t('Rappel : « rien à noter » hier → 1 jour', joursSansSaisie([], '2026-10-31', '2026-10-20', '2026-10-30'), 1);
    t('Rappel : le plus récent des trois l\'emporte', joursSansSaisie([saisie('2026-10-25')], '2026-10-31', '2026-10-20', '2026-10-28'), 3);

    // --- Formats ---
    t('Euros arrondis', [eurosArrondis(4617), eurosArrondis(123456)], ['46\u00A0€', '1\u202F235\u00A0€']);
    t('Saisie négative « -12,5 »', versCentimesSigne('-12,5'), -1250);
    t('Libellé « Période du 25/10 au 24/11 »', libelleDates({ debut: '2026-10-25', fin: '2026-11-24' }), 'Période du 25/10 au 24/11');

    // --- Affichage ---
    const ko = tests.filter(x => x.obtenu !== x.attendu);
    document.getElementById('bilan').innerHTML = ko.length
      ? `<span class="ko">${ko.length} test(s) en échec sur ${tests.length}</span>`
      : `<span class="ok">✓ ${tests.length} tests réussis sur ${tests.length}</span>`;
    document.getElementById('liste').innerHTML = tests.map(x => x.obtenu === x.attendu
      ? `<li class="ok">✓ ${x.nom}</li>`
      : `<li class="ko">✗ ${x.nom}<small>obtenu : ${x.obtenu}<br>attendu : ${x.attendu}</small></li>`).join('');
  </script>
</body>
</html>
